<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <style>
    :root {
      --bg:           #F5F1E8;
      --surface:      #FFFFFF;
      --border:       #E6DFD0;
      --border-hover: #E1D9C7;
      --ink:          #0B1B3A;
      --muted:        #5B6B88;
      --maroon:       #7B1A1A;
      --accent:       #1F4B99;
      --btn:          #0B1B3A;
      --btn-hover:    #0D2D6B;
      --serif:        Georgia, 'Times New Roman', serif;
      --sans:         system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      padding: 28px 16px 64px;
      overflow-wrap: break-word;
    }

    .wrap { max-width: 1180px; margin: 0 auto; }

    /* ── Page header ── */
    .page-header { text-align: center; margin-bottom: 26px; }

    .page-logo {
      height: 34px;
      display: block;
      margin: 0 auto 12px;
      mix-blend-mode: multiply;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(26px, 4.4vw, 34px);
      font-weight: normal;
      line-height: 1.15;
      text-wrap: balance;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 4px;
    }

    .page-updated { font-size: 12px; color: var(--muted); }

    /* ── Micro-labels ── */
    .micro {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--maroon);
    }

    /* ── Category sections ── */
    .board { margin-bottom: 48px; }

    .job-section + .job-section { margin-top: 36px; }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: normal;
      color: var(--ink);
    }

    .section-count { font-size: 12px; color: var(--muted); }

    /* ── Card grid ── */
    .job-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    @media (min-width: 640px)  { .job-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .job-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1280px) { .job-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    /* ── Compact card ── */
    .job-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .job-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 2px 8px rgba(11, 27, 58, 0.06);
    }

    .job-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: normal;
      line-height: 1.3;
      color: var(--ink);
      margin: 0 0 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rate-amount {
      display: block;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.15;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .rate-unit {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .card-teaser {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.55;
      margin: 10px 0 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta { display: flex; flex-wrap: wrap; gap: 10px 16px; }

    .meta-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

    .meta-value { font-size: 13px; color: var(--ink); }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 14px;
    }

    /* ── Buttons and links ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      background: var(--btn);
      color: #FFFFFF;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--btn-hover); }

    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .btn-block { width: 100%; min-height: 46px; font-size: 14px; }

    .details-link {
      background: none;
      border: none;
      padding: 4px 0;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
    }

    .details-link:hover { text-decoration: underline; }

    .details-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(11, 27, 58, 0.45);
    }

    .overlay[hidden] { display: none; }

    .modal {
      position: relative;
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 14px;
      padding: 28px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }

    .modal-close:hover { background: var(--bg); color: var(--ink); }

    .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal-title {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: normal;
      line-height: 1.25;
      color: var(--ink);
      margin: 6px 40px 12px 0;
    }

    .modal-rate { margin-bottom: 18px; }

    .modal-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .modal-req { margin-bottom: 18px; }

    .modal-req .micro { display: block; margin-bottom: 4px; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px 24px;
      padding: 18px 0 22px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    @media (min-width: 560px) { .detail-grid { grid-template-columns: 1fr 1fr; } }

    .detail-value { font-size: 14px; color: var(--ink); margin-top: 3px; }

    /* ── Footer ── */
    .page-footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 2;
    }

    .page-footer a { color: var(--accent); font-weight: 600; text-decoration: none; }

    .page-footer a:hover { text-decoration: underline; }

    .noscript-note {
      max-width: 560px;
      margin: 0 auto 40px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── Mobile tap targets ── */
    @media (max-width: 639px) {
      .btn { min-height: 44px; }
      .details-link { min-height: 44px; display: inline-flex; align-items: center; }
      .modal { padding: 24px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .job-card, .btn { transition: none; }
    }
  </style>
</head>

        "description": [

          "What is being moved: 3 beds, 2 small desks, 3 large chairs, 3 couches, a dining table, and some smaller items.",
          "Expect about an hour and a half with the full crew. Two students are needed for this one.",
          "This job has a second visit about two weeks later to bring everything back inside. The exact date for that one gets confirmed a day or two in advance and timing is flexible, so you should be available for both.",
          "Date: Friday October 2 or Saturday October 3, 2026. Exact day confirmed shortly. Location: About 20 minutes from campus. Full address shared once you are assigned."
        ],
        "requirements": "Good fit if you can lift and carry furniture with a partner, are comfortable on stairs, and show up on time."
      },
      {
        "id": "event-photographer-financial-district",
        "title": "Event Photographer, Financial District",
        "category": "Photography",
        "rate": "$150",
        "rateUnit": "flat",
        "area": "Financial District, Boston",
        "start": "Thursday, September 10",
        "schedule": "5:00 to 7:30pm",
        "hoursPerWeek": "One-time",
        "description": [
          "Shooting the room as it fills, the speakers presenting, the organizers and guests, and candids from the mingling before and after.",
          "The event itself runs 5:30 to 7:30pm. The wider window covers the room filling up beforehand and the mingling after.",
          "Full address shared once you are assigned."

      },
      {
        "id": "mattress-delivery-help-coolidge-corner",
        "title": "Mattress Delivery Help, Coolidge Corner",
        "category": "Moving Help",
        "rate": "$50",
        "rateUnit": "flat",
        "area": "Coolidge Corner, Brookline",
        "start": "Thursday, September 3",
        "schedule": "On call between 11:00am and 3:00pm",
        "hoursPerWeek": "One-time",
        "description": [
          "A mattress and the rest of the delivery are due to arrive sometime between 11:00am and 3:00pm. The job is to be on call across that window, take the delivery when it shows up, and bring everything in from outside to a first floor apartment.",
          "The mattress comes in a box that one person can carry, and there are no stairs. The actual work should be quick. You will be put in touch with the resident, who can give tighter timing on the delivery once they have it."
        ]
      }
    ];

    var CONTACT = 'ben@jobsu.app';

    /**
     * Numeric key for sorting a category's jobs, highest paid first: the
     * midpoint of the dollar figures in `rate` ("$25 to $30" -> 27.5).
     * Note this compares the stated numbers, not an hourly equivalent, so a
     * weekly or flat rate sorts on its own figure. Set `sortRate` on a job to
     * place it manually.
     */
    function rateSortValue(job) {
      if (typeof job.sortRate === 'number') return job.sortRate;
      var nums = (job.rate.match(/[0-9]+(?:\.[0-9]+)?/g) || []).map(Number);
      if (!nums.length) return 0;
      return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
    }

    /** Jobs grouped into sections, categories and jobs both in display order. */
    function groupByCategory(jobs) {
      var groups = {};
      jobs.forEach(function (job) {
        (groups[job.category] = groups[job.category] || []).push(job);
      });
      // Biggest section first; same size falls back to alphabetical.
      var names = Object.keys(groups).sort(function (a, b) {
        return groups[b].length - groups[a].length || a.localeCompare(b);
      });
      return names.map(function (name) {
        // Stable sort: jobs on the same rate keep their order in JOBS.
        var jobsInCategory = groups[name].slice().sort(function (a, b) {
          return rateSortValue(b) - rateSortValue(a);
        });
        return { name: name, jobs: jobsInCategory };
      });
    }

    function mailtoHref(job) {
      var subject = 'Interested: ' + job.title;
      var body = [
        "Hi — I'm interested in this job.",
        '',
        'Name:',
        'School / year:',
        'Do you have a car?:',
        'Availability:'
      ].join('\n');
      return 'mailto:' + CONTACT +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);
    }

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function rateBlock(job, className) {
      var block = el('div', className);
      block.appendChild(el('span', 'rate-amount', job.rate));
      block.appendChild(el('span', 'rate-unit', job.rateUnit));
      return block;
    }

    function metaItem(label, value, valueClass) {
      var item = el('div', 'meta-item');
      item.appendChild(el('span', 'micro', label));
      item.appendChild(el('span', valueClass, value));
      return item;
    }

    function interestedLink(job, extraClass) {
      var link = el('a', 'btn' + (extraClass ? ' ' + extraClass : ''), "I'm interested");
      link.href = mailtoHref(job);
      return link;
    }

    /* ── Cards ── */

    function buildCard(job) {
      var card = el('article', 'job-card');
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-haspopup', 'dialog');
      card.setAttribute('aria-label', job.title + ' — view details');

      card.appendChild(el('h3', 'card-title', job.title));
      card.appendChild(rateBlock(job, 'card-rate'));
      card.appendChild(el('p', 'card-teaser', job.description[0]));

      var meta = el('div', 'card-meta');
      meta.appendChild(metaItem('Area', job.area, 'meta-value'));
      meta.appendChild(metaItem('Schedule', job.schedule, 'meta-value'));
      card.appendChild(meta);

      var actions = el('div', 'card-actions');
      var apply = interestedLink(job);
      apply.addEventListener('click', function (e) { e.stopPropagation(); });
      var details = el('button', 'details-link', 'View details');
      details.type = 'button';
      details.addEventListener('click', function (e) {
        e.stopPropagation();
        openModal(job, card);
      });
      actions.appendChild(apply);
      actions.appendChild(details);
      card.appendChild(actions);

      card.addEventListener('click', function () { openModal(job, card); });
      card.addEventListener('keydown', function (e) {
        if (e.target !== card) return;
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          openModal(job, card);
        }
      });

      return card;
    }

    function renderBoard() {
      var board = document.getElementById('board');

      groupByCategory(JOBS).forEach(function (group) {
        var section = el('section', 'job-section');

        var head = el('div', 'section-head');
        head.appendChild(el('h2', 'section-title', group.name));
        head.appendChild(el('span', 'section-count',
          group.jobs.length + (group.jobs.length === 1 ? ' job' : ' jobs')));
        section.appendChild(head);

        var grid = el('div', 'job-grid');
        group.jobs.forEach(function (job) { grid.appendChild(buildCard(job)); });
        section.appendChild(grid);

        board.appendChild(section);
      });

      document.getElementById('page-updated').textContent =
        JOBS.length + ' open jobs · Updated ' + UPDATED;
    }

    /* ── Modal ── */

    var overlay = document.getElementById('overlay');
    var modal = document.getElementById('modal');
    var modalBody = document.getElementById('modal-body');
    var closeBtn = document.getElementById('modal-close');
    var lastFocused = null;
    var savedScroll = '';

    function buildModalContent(job) {
      var frag = document.createDocumentFragment();

      frag.appendChild(el('span', 'micro', job.category));
      var title = el('h2', 'modal-title', job.title);
      title.id = 'modal-title';
      frag.appendChild(title);
      frag.appendChild(rateBlock(job, 'modal-rate'));

      job.description.forEach(function (para) {
        frag.appendChild(el('p', 'modal-desc', para));
      });

      if (job.requirements) {
        var req = el('div', 'modal-req');
        req.appendChild(el('span', 'micro', 'Requirements'));
        req.appendChild(el('p', 'modal-desc', job.requirements));
        frag.appendChild(req);
      }

      var grid = el('div', 'detail-grid');
      grid.appendChild(metaItem('Start', job.start, 'detail-value'));
      grid.appendChild(metaItem('Schedule', job.schedule, 'detail-value'));
      grid.appendChild(metaItem('Hours/week', job.hoursPerWeek, 'detail-value'));
      grid.appendChild(metaItem('Area', job.area, 'detail-value'));
      frag.appendChild(grid);

      frag.appendChild(interestedLink(job, 'btn-block'));

      return frag;
    }

    function focusables() {
      return Array.prototype.filter.call(
        modal.querySelectorAll('a[href], button:not([disabled])'),
        function (node) { return node.offsetParent !== null; }
      );
    }

    function openModal(job, trigger) {
      lastFocused = trigger || document.activeElement;
      modalBody.textContent = '';
      modalBody.appendChild(buildModalContent(job));
      overlay.hidden = false;
      savedScroll = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      modal.scrollTop = 0;
      closeBtn.focus();
    }

    function closeModal() {
      if (overlay.hidden) return;
      overlay.hidden = true;
      modalBody.textContent = '';
      document.body.style.overflow = savedScroll;
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
      lastFocused = null;
    }

    closeBtn.addEventListener('click', closeModal);

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (overlay.hidden) return;
      if (e.key === 'Escape') {
        closeModal();
        return;
      }
      if (e.key !== 'Tab') return;
      var items = focusables();
      if (!items.length) return;
      var first = items[0];
      var last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      } else if (!modal.contains(document.activeElement)) {
        e.preventDefault();
        first.focus();
      }
    });

    renderBoard();
  </script>
</body>
